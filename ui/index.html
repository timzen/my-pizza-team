<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the phone view (/m) pad for the notch and home
         indicator itself (env(safe-area-inset-*)); resizes-content shrinks the
         layout, not just the visual viewport, when the keyboard opens, so the chat
         composer stays above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pizza Team" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Pizza Team</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
