<!DOCTYPE html>
<html><head><title>📥 pi-pizza-team backlog</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/backlog-page.css">
<link rel="stylesheet" href="/css/nav.css">
<script src="/js/shared.js"></script>
<script src="/js/nav.js" defer></script>
</head><body>
<h1>📥 Backlog</h1>
<p class="subtitle">Stories moved off the active board. Restore them when ready to work on them.</p>

<div class="backlog-list" id="backlog-list">
  <div class="empty-state"><div class="icon">📥</div>Loading...</div>
</div>

<script>
const POLL_MS = 5000;

async function refresh() {
  try {
    const res = await fetch('/api/backlog');
    const data = await res.json();
    renderBacklog(data.stories || []);
  } catch(e) {
    console.error('Refresh error:', e);
  }
}

function renderBacklog(stories) {
  const el = document.getElementById('backlog-list');
  if (stories.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📥</div>Backlog is empty. Move stories here from the board when you want to defer them.</div>';
    return;
  }
  el.innerHTML = stories.map(story => {
    const time = story.backloggedAt ? new Date(story.backloggedAt).toLocaleDateString() : '';
    const deps = (story.dependsOn && story.dependsOn.length > 0)
      ? '<div class="backlog-item-deps">Depends on: ' + story.dependsOn.map(d => escHtml(d)).join(', ') + '</div>'
      : '';
    return '<div class="backlog-item">'
      + '<div class="backlog-item-header">'
      + '<div class="backlog-item-title">' + escHtml(story.title) + '</div>'
      + '<div class="backlog-item-actions">'
      + '<button onclick="restoreStory(\'' + escHtml(story.id) + '\', \'' + escHtml(story.title).replace(/'/g, "\\'") + '\')">↩ Restore</button>'
      + '</div>'
      + '</div>'
      + '<div class="backlog-item-desc">' + renderMarkdown(story.description) + '</div>'
      + deps
      + '<div class="backlog-item-meta">Backlogged: ' + time + '</div>'
      + '</div>';
  }).join('');
}

async function restoreStory(id, title) {
  if (!confirm('Restore "' + title + '" to the active board?')) return;
  try {
    const res = await fetch('/api/backlog/' + encodeURIComponent(id) + '/restore', { method: 'POST' });
    const data = await res.json();
    if (!res.ok || !data.success) { alert(data.error || 'Restore failed'); return; }
    refresh();
  } catch(e) { alert('Error: ' + e.message); }
}

refresh();
setInterval(refresh, POLL_MS);
</script>
</body></html>
