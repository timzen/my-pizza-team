<!DOCTYPE html>
<html><head><title>📦 Archived Stories — pi-pizza-team</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; max-width: 900px; margin: 0 auto; }
  h1 { margin-bottom: 8px; font-size: 1.5em; }
  .nav { margin-bottom: 24px; font-size: 0.85em; }
  .nav a { color: #7c83ff; text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  .subtitle { color: #888; font-size: 0.85em; margin-bottom: 24px; }
  .story-card { border: 1px solid #0f3460; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .story-header { background: #0f3460; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .story-header:hover { background: #1a4080; }
  .story-title { font-weight: 600; font-size: 0.95em; }
  .story-date { font-size: 0.75em; color: #888; }
  .story-id { font-size: 0.72em; color: #666; margin-top: 2px; }
  .story-body { padding: 16px 18px; background: #16213e; display: none; }
  .story-body.open { display: block; }
  .synopsis { font-size: 0.85em; line-height: 1.6; color: #ccc; }
  .empty { text-align: center; padding: 60px 20px; color: #666; }
  .empty-icon { font-size: 2.5em; margin-bottom: 12px; }
  .loading { text-align: center; padding: 60px; color: #888; }
  /* Markdown styles */
  .md-content h1, .md-content h2, .md-content h3, .md-content h4 { color: #e0e0e0; margin: 12px 0 6px 0; }
  .md-content h1 { font-size: 1.2em; } .md-content h2 { font-size: 1.05em; } .md-content h3 { font-size: 0.95em; }
  .md-content p { margin: 6px 0; }
  .md-content ul, .md-content ol { margin: 6px 0; padding-left: 20px; }
  .md-content li { margin: 3px 0; }
  .md-content code { background: #1a1a2e; padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }
  .md-content pre { background: #1a1a2e; padding: 10px; border-radius: 5px; overflow-x: auto; margin: 8px 0; }
  .md-content pre code { background: none; padding: 0; }
  .md-content blockquote { border-left: 3px solid #7c83ff; padding-left: 10px; margin: 8px 0; color: #aaa; }
  .md-content a { color: #7c83ff; }
  .md-content hr { border: none; border-top: 1px solid #0f3460; margin: 12px 0; }
  .btn-enrich { background: none; border: 1px solid #7c83ff; color: #7c83ff; padding: 5px 10px; border-radius: 5px; font-size: 0.75em; cursor: pointer; transition: all 0.15s; }
  .btn-enrich:hover { background: #7c83ff; color: #fff; }
  .btn-enrich:disabled { opacity: 0.5; cursor: not-allowed; }
  .md-content strong { color: #e0e0e0; }
</style></head><body>
<div class="nav"><a href="/board">← Back to Board</a></div>
<h1>📦 Archived Stories</h1>
<div class="subtitle" id="subtitle"></div>
<div id="content"><div class="loading">Loading...</div></div>
<script>
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderMarkdown(text) {
  if (!text) return '<em style="color:#666;">(no synopsis)</em>';
  let html = escHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>(<h[1-4]>)/g, '$1');
  html = html.replace(/(<\/h[1-4]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<blockquote>)/g, '$1');
  html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
  html = html.replace(/<p>(<hr>)<\/p>/g, '$1');
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>([\s\S]*?)<\/p>/g, function(m, inner) {
    return '<p>' + inner.replace(/\n/g, '<br>') + '</p>';
  });
  return html;
}

function toggleStory(el) {
  const body = el.closest('.story-card').querySelector('.story-body');
  body.classList.toggle('open');
}

async function load() {
  try {
    const res = await fetch('/api/archived');
    const data = await res.json();
    const stories = data.stories || [];

    document.getElementById('subtitle').textContent = stories.length + ' archived ' + (stories.length === 1 ? 'story' : 'stories');

    if (stories.length === 0) {
      document.getElementById('content').innerHTML =
        '<div class="empty"><div class="empty-icon">📦</div><div>No archived stories yet.</div>'
        + '<div style="margin-top:8px;font-size:0.85em;color:#555;">Stories with all tasks completed can be archived from the board.</div></div>';
      return;
    }

    // Sort by archivedAt descending (most recent first)
    stories.sort((a, b) => (b.archivedAt || '').localeCompare(a.archivedAt || ''));

    document.getElementById('content').innerHTML = stories.map(s => {
      const date = s.archivedAt ? new Date(s.archivedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : 'Unknown';
      return '<div class="story-card" id="card-' + escHtml(s.id) + '">'
        + '<div class="story-header" onclick="toggleStory(this)">'
        + '<div><div class="story-title">' + escHtml(s.title) + '</div><div class="story-id">' + escHtml(s.id) + '</div></div>'
        + '<div style="display:flex;align-items:center;gap:10px;">'
        + '<button class="btn-enrich" onclick="event.stopPropagation(); enrichSynopsis(\'' + escHtml(s.id) + '\')" title="Generate detailed synopsis with message history">✨ Enrich</button>'
        + '<span class="story-date">' + escHtml(date) + '</span>'
        + '</div>'
        + '</div>'
        + '<div class="story-body"><div class="synopsis md-content" id="synopsis-' + escHtml(s.id) + '">' + renderMarkdown(s.synopsis) + '</div></div>'
        + '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty" style="color:#ff5252;">Error loading archived stories: ' + escHtml(e.message) + '</div>';
  }
}

async function enrichSynopsis(storyId) {
  if (!confirm('Generate an enriched synopsis for this story?\n\nThis will include full task descriptions and message history.')) return;
  // Find and disable the button
  const card = document.getElementById('card-' + storyId);
  const btn = card ? card.querySelector('.btn-enrich') : null;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Enriching...'; }
  try {
    const res = await fetch('/api/archived/' + encodeURIComponent(storyId) + '/enrich', { method: 'POST' });
    const data = await res.json();
    if (!res.ok || !data.success) { alert(data.error || 'Enrich failed'); return; }
    // Update the synopsis in place
    const synopsisEl = document.getElementById('synopsis-' + storyId);
    if (synopsisEl) {
      synopsisEl.innerHTML = renderMarkdown(data.synopsis);
      // Open the body if not already
      const body = synopsisEl.closest('.story-body');
      if (body && !body.classList.contains('open')) body.classList.add('open');
    }
    if (btn) { btn.textContent = '✅ Enriched'; }
  } catch(e) {
    alert('Network error: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '✨ Enrich'; }
  }
}

load();
</script>
</body></html>
