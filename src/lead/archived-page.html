<!DOCTYPE html>
<html><head><title>📦 Archived Stories — pi-pizza-team</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/archived-page.css">
<link rel="stylesheet" href="/css/nav.css">
<script src="/js/shared.js"></script>
<script src="/js/nav.js" defer></script>
</head><body>
<h1>📦 Archived Stories</h1>
<div class="subtitle" id="subtitle"></div>
<div id="content"><div class="loading">Loading...</div></div>
<script>
function toggleStory(el) {
  const body = el.closest('.story-card').querySelector('.story-body');
  body.classList.toggle('open');
}

async function load() {
  try {
    const res = await fetch('/api/archived');
    const data = await res.json();
    const stories = data.stories || [];

    document.getElementById('subtitle').textContent = stories.length + ' archived ' + (stories.length === 1 ? 'story' : 'stories');

    if (stories.length === 0) {
      document.getElementById('content').innerHTML =
        '<div class="empty"><div class="empty-icon">📦</div><div>No archived stories yet.</div>'
        + '<div style="margin-top:8px;font-size:0.85em;color:#555;">Stories with all tasks completed can be archived from the board.</div></div>';
      return;
    }

    // Sort by archivedAt descending (most recent first)
    stories.sort((a, b) => (b.archivedAt || '').localeCompare(a.archivedAt || ''));

    document.getElementById('content').innerHTML = stories.map(s => {
      const date = s.archivedAt ? new Date(s.archivedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : 'Unknown';
      return '<div class="story-card" id="card-' + escHtml(s.id) + '">'
        + '<div class="story-header" onclick="toggleStory(this)">'
        + '<div><div class="story-title">' + escHtml(s.title) + '</div><div class="story-id">' + escHtml(s.id) + '</div></div>'
        + '<span class="story-date">' + escHtml(date) + '</span>'
        + '</div>'
        + '<div class="story-body"><div class="synopsis md-content" id="synopsis-' + escHtml(s.id) + '">' + renderMarkdown(s.synopsis, 'no synopsis') + '</div></div>'
        + '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty" style="color:#ff5252;">Error loading archived stories: ' + escHtml(e.message) + '</div>';
  }
}


load();
</script>
</body></html>
