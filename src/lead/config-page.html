<!DOCTYPE html>
<html><head><title>⚙️ Config — pi-pizza-team</title>
<link rel="stylesheet" href="/css/config-page.css">
<link rel="stylesheet" href="/css/nav.css">
<script src="/js/shared.js"></script>
<script src="/js/nav.js" defer></script>
</head><body>
<h1>⚙️ Configuration</h1>
<div class="subtitle">Manage workflows, autosave settings, and team configuration.</div>

<div id="content"><div style="color:#888;padding:40px;text-align:center;">Loading...</div></div>
<div class="toast" id="toast"></div>

<!-- Browse Directory Modal -->
<div class="modal-overlay" id="browse-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto;" onclick="if(event.target===this)closeBrowseModal()">
  <div style="background:#16213e;border:1px solid #0f3460;border-radius:10px;width:100%;max-width:520px;padding:24px;position:relative;">
    <button style="position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:1.3em;cursor:pointer;" onclick="closeBrowseModal()">&times;</button>
    <h2 style="font-size:1.1em;margin-bottom:12px;">Browse Directories</h2>
    <div id="browse-path" style="font-size:0.82em;color:#7c83ff;margin-bottom:12px;word-break:break-all;"></div>
    <div id="browse-list" style="max-height:350px;overflow-y:auto;margin-bottom:14px;"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:12px;border-top:1px solid #0f3460;">
      <button class="btn btn-outline" onclick="closeBrowseModal()">Cancel</button>
      <button class="btn" onclick="selectBrowsedDir()">Select This Directory</button>
    </div>
  </div>
</div>

<script>
let config = {};

function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { el.className = 'toast'; }, 3000);
}

async function loadConfig() {
  try {
    const res = await fetch('/api/config');
    config = await res.json();
    render();
  } catch(e) { toast('Failed to load config: ' + e.message, true); }
}

async function saveConfig() {
  try {
    const res = await fetch('/api/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config)
    });
    const data = await res.json();
    if (!res.ok || !data.success) { toast(data.error || 'Save failed', true); return; }
    toast('✓ Configuration saved');
  } catch(e) { toast('Network error: ' + e.message, true); }
}

let activeTab = localStorage.getItem('config-tab') || 'general';

function render() {
  const el = document.getElementById('content');
  const tabs = [
    { id: 'general', label: 'General' },
    { id: 'teammates', label: 'Teammates' },
    { id: 'workflows', label: 'Workflows' },
  ];
  const tabBar = '<div class="tab-bar">' + tabs.map(t =>
    '<button class="tab-btn' + (t.id === activeTab ? ' tab-active' : '') + '" onclick="switchTab(\'' + t.id + '\')">' + t.label + '</button>'
  ).join('') + '</div>';

  let content = '';
  if (activeTab === 'general') content = renderGeneral();
  else if (activeTab === 'teammates') content = renderTeammates();
  else if (activeTab === 'workflows') content = renderWorkflows();

  el.innerHTML = tabBar + '<div class="tab-content">' + content + '</div>' + renderSaveBar();
  bindEvents();
}

function switchTab(tab) {
  activeTab = tab;
  localStorage.setItem('config-tab', tab);
  render();
}

function renderGeneral() {
  return '<div class="section">'
    + '<h3>Server</h3>'
    + '<div class="form-row"><label>Port</label><input type="number" id="cfg-port" value="' + config.port + '" /></div>'
    + '<div class="form-row"><label>Tmux Session</label><input type="text" id="cfg-tmux" value="' + escHtml(config.tmuxSession || '') + '" /></div>'
    + '<div class="form-row"><label>Max Teammates</label><input type="number" id="cfg-max" value="' + (config.maxTeammates || 4) + '" /></div>'
    + '<div class="form-row"><label>Default Workflow</label><select id="cfg-default-wf">'
    + Object.keys(config.workflows || {}).map(n => '<option value="' + escHtml(n) + '"' + (n === config.defaultWorkflow ? ' selected' : '') + '>' + escHtml(n) + '</option>').join('')
    + '</select></div>'
    + '</div>'
    + '<div class="section">'
    + '<h3>Autosave</h3>'
    + '<div class="form-row"><label>Flush Interval (min)</label><input type="number" id="cfg-flush" value="' + (config.autosave ? config.autosave.flushIntervalMinutes : 30) + '" /></div>'
    + '<div class="form-row"><label>Commit Interval (hrs)</label><input type="number" id="cfg-commit-hrs" value="' + (config.autosave ? config.autosave.commitIntervalHours : 24) + '" /></div>'
    + '<div class="form-row"><label>Auto Commit</label><select id="cfg-autocommit"><option value="true"' + (config.autosave && config.autosave.autoCommit ? ' selected' : '') + '>Yes</option><option value="false"' + (config.autosave && !config.autosave.autoCommit ? ' selected' : '') + '>No</option></select></div>'
    + '</div>';
}

function renderWorkflows() {
  const wfs = config.workflows || {};
  let html = '';
  for (const [name, wf] of Object.entries(wfs)) {
    const isDefault = name === config.defaultWorkflow;
    html += renderWorkflowCard(name, wf, isDefault);
  }
  html += '<div class="btn-group"><button class="btn btn-outline" onclick="addWorkflow()">+ New Workflow</button></div>';
  return html;
}

function renderTeammates() {
  if (!config.teammates) config.teammates = {};
  const nouns = config.teammates.nouns || [];
  const favDirs = config.teammates.favoriteDirectories || [];

  // Nouns section
  const nounsHtml = nouns.length > 0
    ? '<div class="states-list">' + nouns.map(n =>
        '<span class="state-tag">' + escHtml(n)
        + ' <span class="remove-state" onclick="removeNoun(\'' + escHtml(n).replace(/'/g, "\\'") + '\')" title="Remove">&times;</span>'
        + '</span>'
      ).join('') + '</div>'
    : '<div style="font-size:0.8em;color:#666;margin-bottom:8px;">Using defaults (sci-fi characters)</div>';

  // Favorite directories section
  const dirsHtml = favDirs.length > 0
    ? '<div style="margin-bottom:8px;">' + favDirs.map((d, i) =>
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">'
        + '<code style="background:#0f3460;padding:3px 8px;border-radius:4px;font-size:0.82em;flex:1;">' + escHtml(d) + '</code>'
        + '<button class="btn btn-sm btn-danger" onclick="removeFavoriteDir(' + i + ')">&times;</button>'
        + '</div>'
      ).join('') + '</div>'
    : '<div style="font-size:0.8em;color:#666;margin-bottom:8px;">No favorites configured</div>';

  return '<div class="section">'
    + '<h3>Name Nouns</h3>'
    + '<div style="font-size:0.78em;color:#888;margin-bottom:8px;">Custom nouns for auto-generated names (adjective-noun). Leave empty for sci-fi character defaults.</div>'
    + nounsHtml
    + '<div class="add-state-row"><input type="text" id="new-noun" placeholder="Add a noun..." onkeydown="if(event.key===\'Enter\')addNoun()" /><button class="btn btn-sm" onclick="addNoun()">Add</button></div>'
    + '<h3 style="margin-top:18px;">Favorite Directories</h3>'
    + '<div style="font-size:0.78em;color:#888;margin-bottom:8px;">Quick-pick directories when spawning teammates.</div>'
    + dirsHtml
    + '<div class="add-state-row"><input type="text" id="new-fav-dir" placeholder="~/Workspace/my-project" onkeydown="if(event.key===\'Enter\')addFavoriteDir()" /><button class="btn btn-sm" onclick="addFavoriteDir()">Add</button><button class="btn btn-sm btn-outline" onclick="openBrowseModal()" style="margin-left:4px;">📂 Browse</button></div>'
    + '</div>';
}

function renderWorkflowCard(name, wf, isDefault) {
  const badge = isDefault ? ' <span class="workflow-badge">default</span>' : '';
  const deleteBtn = !isDefault ? ' <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deleteWorkflow(\'' + escHtml(name) + '\')">Delete</button>' : '';

  // States
  const statesHtml = (wf.states || []).map(s =>
    '<span class="state-tag">' + escHtml(s)
    + ' <span class="remove-state" onclick="removeState(\'' + escHtml(name) + '\', \'' + escHtml(s) + '\')" title="Remove state">×</span>'
    + '</span>'
  ).join('');

  // Transitions table
  let transHtml = '<table class="transitions-table"><thead><tr><th>From</th><th>To</th><th>Permission</th><th></th></tr></thead><tbody>';
  const transitions = wf.transitions || {};
  for (const [from, targets] of Object.entries(transitions)) {
    for (const [to, perm] of Object.entries(targets)) {
      transHtml += '<tr>'
        + '<td class="from-state">' + escHtml(from) + '</td>'
        + '<td>' + escHtml(to) + '</td>'
        + '<td><select onchange="updateTransitionPerm(\'' + escHtml(name) + '\', \'' + escHtml(from) + '\', \'' + escHtml(to) + '\', this.value)">'
        + '<option value="any"' + (perm === 'any' ? ' selected' : '') + '>any</option>'
        + '<option value="teammate"' + (perm === 'teammate' ? ' selected' : '') + '>teammate</option>'
        + '<option value="lead"' + (perm === 'lead' ? ' selected' : '') + '>lead</option>'
        + '</select></td>'
        + '<td><button class="btn btn-sm btn-danger" onclick="removeTransition(\'' + escHtml(name) + '\', \'' + escHtml(from) + '\', \'' + escHtml(to) + '\')">×</button></td>'
        + '</tr>';
    }
  }
  transHtml += '</tbody></table>';

  // Add transition row
  const stateOptions = (wf.states || []).map(s => '<option value="' + escHtml(s) + '">' + escHtml(s) + '</option>').join('');
  const addTransRow = '<div class="form-row" style="margin-top:10px;">'
    + '<select id="trans-from-' + escHtml(name) + '">' + stateOptions + '</select>'
    + '<span style="color:#888;">→</span>'
    + '<select id="trans-to-' + escHtml(name) + '">' + stateOptions + '</select>'
    + '<select id="trans-perm-' + escHtml(name) + '"><option value="any">any</option><option value="teammate">teammate</option><option value="lead">lead</option></select>'
    + '<button class="btn btn-sm" onclick="addTransition(\'' + escHtml(name) + '\')">Add</button>'
    + '</div>';

  return '<div class="workflow-card">'
    + '<div class="workflow-header" onclick="toggleWorkflow(this)">'
    + '<span class="workflow-name">' + escHtml(name) + badge + '</span>'
    + '<span>' + deleteBtn + '</span>'
    + '</div>'
    + '<div class="workflow-body">'
    + '<h3>States</h3>'
    + '<div class="states-list">' + statesHtml + '</div>'
    + '<div class="add-state-row"><input type="text" id="new-state-' + escHtml(name) + '" placeholder="New state name..." onkeydown="if(event.key===\'Enter\')addState(\'' + escHtml(name) + '\')" /><button class="btn btn-sm" onclick="addState(\'' + escHtml(name) + '\')">Add</button></div>'
    + '<h3>Transitions</h3>'
    + transHtml
    + addTransRow
    + '</div></div>';
}

function renderSaveBar() {
  return '<div class="save-bar">'
    + '<span class="save-status" id="save-status"></span>'
    + '<button class="btn" onclick="gatherAndSave()">💾 Save Configuration</button>'
    + '</div>';
}

function toggleWorkflow(el) {
  const body = el.closest('.workflow-card').querySelector('.workflow-body');
  body.style.display = body.style.display === 'none' ? '' : 'none';
}

// --- Workflow management ---

function addWorkflow() {
  const name = prompt('Workflow name (lowercase, hyphens):');
  if (!name || !name.match(/^[a-z][a-z0-9-]*$/)) { if (name) toast('Invalid name: use lowercase + hyphens', true); return; }
  if (config.workflows[name]) { toast('Workflow "' + name + '" already exists', true); return; }
  config.workflows[name] = { states: ['todo', 'done'], transitions: { todo: { done: 'any' } } };
  render();
}

function deleteWorkflow(name) {
  if (!confirm('Delete workflow "' + name + '"? Stories using it will fall back to default.')) return;
  delete config.workflows[name];
  render();
}

function addState(wfName) {
  const input = document.getElementById('new-state-' + wfName);
  const state = input.value.trim().toLowerCase().replace(/[^a-z0-9_]+/g, '_');
  if (!state) return;
  if (config.workflows[wfName].states.includes(state)) { toast('State "' + state + '" already exists', true); return; }
  config.workflows[wfName].states.push(state);
  render();
}

function removeState(wfName, state) {
  const wf = config.workflows[wfName];
  wf.states = wf.states.filter(s => s !== state);
  // Also remove transitions referencing this state
  delete wf.transitions[state];
  for (const from of Object.keys(wf.transitions)) {
    delete wf.transitions[from][state];
    if (Object.keys(wf.transitions[from]).length === 0) delete wf.transitions[from];
  }
  render();
}

function addTransition(wfName) {
  const from = document.getElementById('trans-from-' + wfName).value;
  const to = document.getElementById('trans-to-' + wfName).value;
  const perm = document.getElementById('trans-perm-' + wfName).value;
  if (!from || !to || from === to) { toast('Select different from/to states', true); return; }
  const wf = config.workflows[wfName];
  if (!wf.transitions[from]) wf.transitions[from] = {};
  wf.transitions[from][to] = perm;
  render();
}

function removeTransition(wfName, from, to) {
  const wf = config.workflows[wfName];
  if (wf.transitions[from]) {
    delete wf.transitions[from][to];
    if (Object.keys(wf.transitions[from]).length === 0) delete wf.transitions[from];
  }
  render();
}

function updateTransitionPerm(wfName, from, to, perm) {
  config.workflows[wfName].transitions[from][to] = perm;
}

// --- Teammates config ---

function addNoun() {
  const input = document.getElementById('new-noun');
  const noun = input.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '');
  if (!noun) return;
  if (!config.teammates) config.teammates = {};
  if (!config.teammates.nouns) config.teammates.nouns = [];
  if (config.teammates.nouns.includes(noun)) { toast('Noun "' + noun + '" already exists', true); return; }
  config.teammates.nouns.push(noun);
  render();
}

function removeNoun(noun) {
  if (!config.teammates || !config.teammates.nouns) return;
  config.teammates.nouns = config.teammates.nouns.filter(n => n !== noun);
  if (config.teammates.nouns.length === 0) delete config.teammates.nouns;
  render();
}

function addFavoriteDir() {
  const input = document.getElementById('new-fav-dir');
  const dir = input.value.trim();
  if (!dir) return;
  if (!config.teammates) config.teammates = {};
  if (!config.teammates.favoriteDirectories) config.teammates.favoriteDirectories = [];
  if (config.teammates.favoriteDirectories.includes(dir)) { toast('Directory already in favorites', true); return; }
  config.teammates.favoriteDirectories.push(dir);
  render();
}

function removeFavoriteDir(index) {
  if (!config.teammates || !config.teammates.favoriteDirectories) return;
  config.teammates.favoriteDirectories.splice(index, 1);
  if (config.teammates.favoriteDirectories.length === 0) delete config.teammates.favoriteDirectories;
  render();
}

// --- Directory Browser ---
let currentBrowsePath = '~';

async function openBrowseModal() {
  document.getElementById('browse-modal').style.display = 'flex';
  currentBrowsePath = '~';
  await browseTo('~');
}

function closeBrowseModal() {
  document.getElementById('browse-modal').style.display = 'none';
}

async function browseTo(dir) {
  currentBrowsePath = dir;
  document.getElementById('browse-path').textContent = dir;
  document.getElementById('browse-list').innerHTML = '<div style="color:#888;font-size:0.85em;">Loading...</div>';
  try {
    const res = await fetch('/api/browse?path=' + encodeURIComponent(dir));
    const data = await res.json();
    if (data.error) {
      document.getElementById('browse-list').innerHTML = '<div style="color:#e74c3c;font-size:0.85em;">' + escHtml(data.error) + '</div>';
      return;
    }
    currentBrowsePath = data.path;
    document.getElementById('browse-path').textContent = data.path;

    let html = '';
    // Parent directory link
    if (data.path !== '~' && data.path !== '/') {
      const parentPath = data.path.replace(/\/[^\/]+$/, '') || '/';
      html += '<div style="padding:6px 10px;cursor:pointer;border-radius:4px;font-size:0.85em;color:#888;" onmouseover="this.style.background=\'#0f3460\'" onmouseout="this.style.background=\'\'" onclick="browseTo(\'' + escHtml(parentPath).replace(/'/g, "\\'") + '\')">← ..</div>';
    }
    if (data.dirs.length === 0) {
      html += '<div style="padding:10px;color:#666;font-size:0.85em;">No subdirectories</div>';
    } else {
      for (const d of data.dirs) {
        const fullPath = data.path === '/' ? '/' + d : data.path + '/' + d;
        html += '<div style="padding:6px 10px;cursor:pointer;border-radius:4px;font-size:0.85em;" onmouseover="this.style.background=\'#0f3460\'" onmouseout="this.style.background=\'\'" onclick="browseTo(\'' + escHtml(fullPath).replace(/'/g, "\\'") + '\')">📁 ' + escHtml(d) + '</div>';
      }
    }
    document.getElementById('browse-list').innerHTML = html;
  } catch(e) {
    document.getElementById('browse-list').innerHTML = '<div style="color:#e74c3c;font-size:0.85em;">Error: ' + escHtml(e.message) + '</div>';
  }
}

function selectBrowsedDir() {
  document.getElementById('new-fav-dir').value = currentBrowsePath;
  closeBrowseModal();
  addFavoriteDir();
}

// --- Gather form values and save ---

function gatherAndSave() {
  config.port = parseInt(document.getElementById('cfg-port').value) || config.port;
  config.tmuxSession = document.getElementById('cfg-tmux').value.trim() || config.tmuxSession;
  config.maxTeammates = parseInt(document.getElementById('cfg-max').value) || 4;
  config.defaultWorkflow = document.getElementById('cfg-default-wf').value;
  config.autosave = config.autosave || {};
  config.autosave.flushIntervalMinutes = parseInt(document.getElementById('cfg-flush').value) || 30;
  config.autosave.commitIntervalHours = parseInt(document.getElementById('cfg-commit-hrs').value) || 24;
  config.autosave.autoCommit = document.getElementById('cfg-autocommit').value === 'true';
  // teammates config is already updated in-place by add/remove functions
  saveConfig();
}

function bindEvents() {}

loadConfig();
</script>
</body></html>
