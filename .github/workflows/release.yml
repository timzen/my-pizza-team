# .github/workflows/release.yml — Publish the npm package and create the GitHub Release.
#
# Triggered on version tags (v*), which scripts/publish.sh creates. mpt ships as an
# npm package (`npm i -g my-pizza-team`, Node >=24) — compiled JS in dist/ plus the
# built web UI and the Pi extension (package.json "files"); there are no per-platform
# binaries any more.
#
# Jobs:
#   - publish    Node 24 → npm ci → gates → smoke-test the packed tarball →
#                `npm publish --provenance`. Required.
#   - macos-app  The menu bar app's DMG (universal). The app is only the menu UI: it
#                runs the npm-installed mpt with the saved Node. BEST-EFFORT: if it
#                fails (disk pressure, notary flakiness) the release still goes out
#                without the DMG.
#   - release    The GitHub Release: generated notes and the DMG.
#
# Secrets:
#   - NPM_TOKEN  npm automation (or granular publish) token for the my-pizza-team
#                package. Required by `publish`.
#   - APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, MPT_SIGNATURE, APPLE_ID,
#     APPLE_APP_PASSWORD, APPLE_TEAM_ID — optional; sign and notarize the DMG. Without
#     them the app is ad-hoc signed.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Matches ci.yml and package.json "engines" (node:sqlite, type stripping).
  NODE_VERSION: '24'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: the registry records which workflow run built the package.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Tag matches the package version
        # publish.sh bumps the version and tags in one commit; a hand-made tag that
        # disagrees would publish a version nobody asked for.
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - name: Gates
        run: |
          npm run check
          npm test

      - name: Smoke-test the packed package
        # Install the exact tarball that will be published into a scratch prefix and
        # check that `mpt setup` finds the bundled Pi extension — the check that used
        # to guard the compiled binary's embedded files. `npm pack` runs prepack
        # (`npm run build`: UI + tsc → dist/).
        run: |
          npm pack
          sandbox="$(mktemp -d)"
          mkdir -p "$sandbox/prefix" "$sandbox/home/.pi/agent" "$sandbox/project"
          npm install -g --prefix "$sandbox/prefix" ./my-pizza-team-*.tgz
          cd "$sandbox/project"
          HOME="$sandbox/home" MPT_HOME="$sandbox/home" MPT_NODE="$(command -v node)" \
            PI_CODING_AGENT_DIR="$sandbox/home/.pi/agent" TEAM_DIR="$sandbox/project/.my-pizza-team" \
            "$sandbox/prefix/bin/mpt" setup --dry-run | tee out.txt
          grep -q "write the bundled Pi extension" out.txt

      - name: Publish
        # prepack rebuilds dist/ from this checkout, so what is published is what the
        # smoke test installed.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The macOS menu bar app is the most fragile part of the release (runner disk
  # pressure, Apple notary service flakiness). It is explicitly best-effort: a
  # failure here must not block the release. See the `release` job's `if:` gate.
  macos-app:
    name: Build macOS Menu Bar App
    runs-on: macos-latest
    continue-on-error: true
    env:
      HAS_SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      APP_DIR: 'desktop/macos/dist/My Pizza Team.app'
      DMG: 'desktop/macos/dist/My-Pizza-Team-macos.dmg'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the .app bundle (universal)
        # One definition of the bundle (Info.plist, icon, version from package.json).
        run: ./scripts/package-macos-menubar.sh

      - name: Install Apple signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No signing certificate configured — using ad-hoc signing"
            codesign --force --sign - "$APP_DIR/Contents/MacOS/MyPizzaTeamMenu"
            codesign --force --sign - "$APP_DIR"
            exit 0
          fi
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

      - name: Sign the app with Developer ID
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MPT_SIGNATURE: ${{ secrets.MPT_SIGNATURE }}
        run: |
          # Inside-out: the executable, then the bundle (--deep is unreliable). No
          # entitlements: the app no longer embeds a V8 runtime; mpt runs under the
          # user's own Node.
          codesign --force --options runtime --sign "$MPT_SIGNATURE" \
            "$APP_DIR/Contents/MacOS/MyPizzaTeamMenu"
          codesign --force --options runtime --sign "$MPT_SIGNATURE" "$APP_DIR"
          codesign --verify --deep --strict "$APP_DIR"
          echo "✅ Signature verified"

      - name: Create DMG
        run: |
          # Stage under RUNNER_TEMP (separate headroom from the checkout) to avoid
          # "No space left on device" on tight runners.
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_DIR" "$STAGE/"
          # A symlink to /Applications for drag-and-drop install
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "My Pizza Team" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"
          echo "✅ DMG created"

      - name: Notarize the DMG
        # Notary outages/timeouts are common; a signed-but-unnotarized DMG is
        # still usable (with a Gatekeeper prompt), so don't fail the job for it.
        continue-on-error: true
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 60m
          xcrun stapler staple "$DMG"
          echo "✅ DMG notarized and stapled"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ env.DMG }}
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [publish, macos-app]
    # Run even when macos-app failed — the DMG is simply omitted. The npm publish is
    # required: a GitHub release for a version that isn't on npm would mislead.
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download the DMG
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-app
          path: release/

      - name: Check release assets
        id: assets
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          mkdir -p release/
          if [ -z "$(ls -A release/)" ]; then
            echo "::warning::macOS menu bar app (.dmg) missing from this release — the Build macOS Menu Bar App job produced no artifact."
          fi
          ls -l release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Install or upgrade (Node.js >=24):

            ```bash
            npm i -g my-pizza-team@${{ steps.assets.outputs.version }}   # or: mpt upgrade
            mpt setup
            ```

            The macOS menu bar app (DMG) runs the npm-installed `mpt`; install the package first.
          files: |
            release/*
