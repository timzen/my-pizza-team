# .github/workflows/ci.yml — Continuous integration checks.
#
# Runs on PRs and pushes to main. One job per gate, so a failure names which part of
# the repo broke rather than "CI failed". These are the same gates AGENTS.md asks for
# before a commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The daemon, CLI and tests run on Node's type stripping and node:sqlite (>=24,
  # package.json "engines").
  NODE_VERSION: '24'
  # The Pi extension is type-stripped by Node at load time; Pi itself needs >=22.19.
  EXT_NODE_VERSION: '22'

jobs:
  daemon:
    name: Daemon — type check & fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Fast tests
        shell: bash
        run: |
          set -o pipefail
          NO_COLOR=1 npm test 2>&1 | tee test.log || { python3 scripts/ci-annotate.py < test.log; exit 1; }
      - name: Generated files are in step
        # The extension's version and shared constants are generated from the repo
        # root; drift is exactly what the monorepo merge exists to prevent.
        run: |
          npm run sync-version -- --check
          npm run sync-shared -- --check

  e2e:
    name: End-to-end — real git, tmux, and shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install tmux
        # The e2e suite drives a real (private, per-test) tmux server. Without tmux
        # those tests skip, and a skip in CI would read as a pass.
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Verify tmux is really available
        run: tmux -V
      - name: End-to-end tests
        # Failures are re-emitted as annotations (scripts/ci-annotate.py), which anyone
        # can read — job logs need authentication, so otherwise a failure reads only as
        # "exit code 1" from outside.
        shell: bash
        run: |
          set -o pipefail
          NO_COLOR=1 npm run test:e2e 2>&1 | tee e2e.log || { python3 scripts/ci-annotate.py < e2e.log; exit 1; }

  extension:
    name: Pi extension — type check & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harnesses/pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.EXT_NODE_VERSION }}
          cache: npm
          cache-dependency-path: harnesses/pi/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test

  ui:
    name: Web UI — type check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
